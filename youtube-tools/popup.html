<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>YouTube Tools</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="update.css" />
</head>
<body>
  <main class="card">
    <header class="head">
      <button id="theme" class="icon-btn" type="button" title="Thème clair / sombre" aria-label="Basculer le thème">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path class="moon" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <g class="sun" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/>
          </g>
        </svg>
      </button>

      <h1 class="title"><span class="eyes">👀</span> YouTube Tools</h1>

      <div class="head-right">
        <button id="reset" class="icon-btn" type="button" title="Vider les champs de l'aperçu" aria-label="Vider les champs de l'aperçu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <path d="M21 3v6h-6"/>
          </svg>
        </button>
        <button id="ouvrirReglages" class="icon-btn" type="button" title="Paramètres" aria-label="Ouvrir les paramètres">
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Paramètres : un écran à part, ouvert par la roue crantée. -->
    <section id="vueReglages" class="reglages" aria-labelledby="titreReglages" hidden>
      <div class="reglages-tete">
        <button id="retour" class="retour" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          Retour
        </button>
        <h2 id="titreReglages" class="reglages-titre">Paramètres</h2>
      </div>

      <div class="sites" role="tablist" aria-label="Où s'appliquent les réglages">
        <button class="site" type="button" role="tab" data-site="youtube" aria-selected="true">YouTube</button>
        <button class="site" type="button" role="tab" data-site="studio" aria-selected="false">YouTube Studio</button>
      </div>

      <div id="reglagesListe" class="reglages-liste" role="tabpanel"></div>

      <p id="reglagesAide" class="reglages-aide" aria-live="polite"></p>
      <p class="reglages-pied">Les changements s'appliquent tout de suite, sans recharger la page. <span id="version"></span>
        <button id="ouvrirMaj" class="reglages-lien" type="button">Mises à jour</button></p>
    </section>

    <div id="vueAccueil">
    <div id="maj" class="maj-bandeau" role="status" hidden>
      <span id="majTexte"></span>
      <button id="majBtn" type="button">Mettre à jour</button>
    </div>

    <section class="field row">
      <button id="avatarBtn" class="avatar" type="button" title="Choisir un avatar de chaîne" aria-label="Avatar de la chaîne">
        <img id="avatarImg" alt="" hidden />
        <svg class="avatar-ph" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.2 0-8 2.2-8 5v1h16v-1c0-2.8-3.8-5-8-5Z"/>
        </svg>
      </button>
      <div class="grow">
        <label class="label" for="channel">Nom de la chaîne</label>
        <input id="channel" type="text" maxlength="60" placeholder="Chaîne" autocomplete="off" spellcheck="false" />
      </div>
    </section>

    <section class="field">
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Ajouter une miniature">
        <img id="thumbImg" alt="" hidden />
        <div class="drop-empty">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"/>
            <path d="M3 16l4.5-4.5a2 2 0 0 1 2.8 0L15 16"/>
            <path d="M14 14.5l1.8-1.8a2 2 0 0 1 2.8 0L21 15.5"/>
            <circle cx="15.5" cy="8.5" r="1.4"/>
          </svg>
          <span>Glisse ta miniature ici<br /><small>ou clique / colle (Ctrl+V)</small></span>
        </div>
        <button id="clearThumb" class="clear" type="button" title="Retirer la miniature" hidden aria-label="Retirer la miniature">×</button>
      </div>
      <p id="thumbInfo" class="hint"></p>
    </section>

    <section class="field">
      <label class="label" for="videoTitle">Titre de la vidéo</label>
      <input id="videoTitle" type="text" maxlength="120" placeholder="Titre" autocomplete="off" />
      <p class="hint counter"><span id="titleCount">0</span>/120 — YouTube coupe autour de 60-70 caractères</p>
    </section>

    <section class="field switch-row">
      <span class="switch-label">Position aléatoire</span>
      <button id="randomPos" class="switch" type="button" role="switch" aria-checked="false" aria-label="Position aléatoire"><span class="knob"></span></button>
    </section>

    <button id="preview" class="cta" type="button"><span class="eyes">👀</span> Aperçu</button>
    <button id="remove" class="ghost" type="button" hidden>Retirer l'aperçu</button>

    <p id="status" class="status" role="status"></p>

    <footer class="foot">
      Recodé en Manifest V3 — d'après <b>PrevYou</b> de BenjaminCode, design BastiUi.
    </footer>
    </div>
  </main>

  <input id="thumbFile" type="file" accept="image/*" hidden />
  <input id="avatarFile" type="file" accept="image/*" hidden />
  <script src="update-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
